name: Sync series state to OpsHub
on:
  push:
    paths:
      - "memory/series_state.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Send series state to hub
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python hub.py state
