name: Sync series state to OpsHub
on:
  push:
    paths:
      - "memory/series_state.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Send series state to hub
        shell: python
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          import hashlib, hmac, json, os, re, time, urllib.request

          state_path = "memory/series_state.json"
          if not os.path.exists(state_path):
              print("state_sync: no series_state.json, skipping")
              raise SystemExit(0)
          with open(state_path) as f:
              state = json.load(f)

          def slug(s):
              return re.sub(r"[^a-z0-9]+", "-", (s or "series").lower()).strip("-") or "series"

          series_id = slug(state.get("title", "series"))
          ep = int(state.get("episode_number", 0) or 0)
          finished = bool(state.get("finished"))
          max_ep = None
          try:
              with open("pipeline.py") as f:
                  m = re.search(r"MAX_EPISODES\s*=\s*(\d+)", f.read())
              if m:
                  max_ep = int(m.group(1))
          except Exception:
              pass

          ev = {
              "schema_version": 1,
              "event_id": f"studio-{series_id}-state-ep{ep}-fin{1 if finished else 0}",
              "type": "content.series_state",
              "source": "studio",
              "series_id": series_id,
              "channel_name": os.environ.get("GITHUB_REPOSITORY", "").split("/")[-1],
              "title": state.get("title", ""),
              "episode_number": ep,
              "max_episodes": max_ep,
              "finished": finished,
              "last_hook": state.get("last_hook", ""),
              "occurred_at": int(time.time()),
          }
          url = os.environ["HUB_URL"].rstrip("/") + "/ingest"
          secret = os.environ["HUB_WEBHOOK_SECRET"].encode()
          body = json.dumps(ev).encode()
          mac = hmac.new(secret, body, hashlib.sha256)
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Content-Type": "application/json",
              "x-hub-signature-256": "sha256=" + mac.hexdigest(),
          })
          with urllib.request.urlopen(req, timeout=15) as resp:
              print("state_sync:", resp.status, resp.read().decode())
