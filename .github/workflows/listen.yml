name: listen
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency: {group: listen, cancel-in-progress: true}
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 listen.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
      - name: save offset
        run: |
          git config user.name "studio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memory/ || true
          git diff --cached --quiet && echo "no offset change" && exit 0
          git commit -m "offset update"
          for i in 1 2 3; do git push && break || (git pull --rebase origin main; sleep 3); done
